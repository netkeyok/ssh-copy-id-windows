[package]
name = "ssh-copy-id"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "ssh-copy-id for Windows: install your public key into a remote host's authorized_keys without the OpenSSH shell script"
authors = ["Rinat <netkeyok@gmail.com>"]
license = "MIT"
repository = "https://github.com/netkeyok/ssh-copy-id-windows"
homepage = "https://github.com/netkeyok/ssh-copy-id-windows"
readme = "README.md"
keywords = ["ssh", "ssh-copy-id", "openssh", "windows", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "ssh-copy-id"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
